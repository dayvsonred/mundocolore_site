<div class="complete-profile-page">
  <mat-card>
    <mat-card-title>Complete seu cadastro</mat-card-title>
    <mat-card-subtitle>
      Precisamos do CPF para compras e operacoes financeiras na Mundo Colore.
    </mat-card-subtitle>

    <div class="loading-profile" *ngIf="loadingProfile">
      <mat-spinner diameter="32"></mat-spinner>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loadingProfile">
      <mat-form-field appearance="outline">
        <mat-label>Nome completo</mat-label>
        <input matInput formControlName="name" autocomplete="name">
        <mat-error *ngIf="form.controls['name'].hasError('required')">
          Informe seu nome.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email" type="email" autocomplete="email">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>CPF</mat-label>
        <input matInput formControlName="cpf" mask="000.000.000-00" inputmode="numeric">
        <mat-error *ngIf="form.controls['cpf'].hasError('required')">
          Informe seu CPF.
        </mat-error>
        <mat-error *ngIf="form.controls['cpf'].hasError('cpfInvalid')">
          Informe um CPF valido.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Telefone (opcional)</mat-label>
        <input matInput formControlName="phone" mask="(00) 00000-0000" autocomplete="tel">
      </mat-form-field>

      <div class="form-actions">
        <button mat-button type="button" (click)="logout()" [disabled]="loading">Sair</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          Salvar e continuar
        </button>
      </div>
    </form>

    <mat-progress-bar *ngIf="loading" mode="indeterminate"></mat-progress-bar>
  </mat-card>
</div>
