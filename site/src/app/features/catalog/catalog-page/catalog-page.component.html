<div class="catalog-page">
  <header class="catalog-header">
    <div>
      <p class="catalog-kicker">Mundo Colore</p>
      <h1>Catalogo de produtos</h1>
    </div>

    <button
      type="button"
      class="filter-trigger"
      [attr.aria-expanded]="isFilterDrawerOpen"
      (click)="openFilterDrawer()">
      <span class="filter-trigger-icon" aria-hidden="true"></span>
      Filtrar
      <strong *ngIf="hasActiveFilters">{{ activeFilterCount }}</strong>
    </button>
  </header>

  <div class="catalog-layout">
    <button
      *ngIf="isFilterDrawerOpen"
      type="button"
      class="filter-overlay"
      aria-label="Fechar filtros"
      (click)="closeFilterDrawer()">
    </button>

    <aside class="filters-panel" [class.drawer-open]="isFilterDrawerOpen" aria-label="Filtros de produtos">
      <div class="filters-heading">
        <div>
          <p>Refinar</p>
          <h2>Filtros</h2>
        </div>

        <button
          type="button"
          class="filters-close"
          aria-label="Fechar filtros"
          (click)="closeFilterDrawer()">
          x
        </button>
      </div>

      <div class="filter-sections">
        <section class="filter-section">
          <button
            type="button"
            class="section-toggle"
            [attr.aria-expanded]="sectionOpen.category"
            (click)="toggleSection('category')">
            Categoria
            <span class="section-chevron" aria-hidden="true"></span>
          </button>

          <div *ngIf="sectionOpen.category" class="option-list">
            <label *ngFor="let category of categoryOptions" class="checkbox-option">
              <input
                type="checkbox"
                [checked]="isSelected(selectedCategories, category)"
                (change)="toggleOption(selectedCategories, category)">
              <span>{{ category }}</span>
            </label>
            <p *ngIf="!categoryOptions.length" class="empty-options">Sem categorias disponiveis.</p>
          </div>
        </section>

        <section class="filter-section">
          <button
            type="button"
            class="section-toggle"
            [attr.aria-expanded]="sectionOpen.size"
            (click)="toggleSection('size')">
            Tamanho
            <span class="section-chevron" aria-hidden="true"></span>
          </button>

          <div *ngIf="sectionOpen.size" class="option-list size-options">
            <label *ngFor="let size of sizeOptions" class="checkbox-option size-option">
              <input
                type="checkbox"
                [checked]="isSelected(selectedSizes, size)"
                (change)="toggleOption(selectedSizes, size)">
              <span>{{ size }}</span>
            </label>
          </div>
        </section>

        <section class="filter-section">
          <button
            type="button"
            class="section-toggle"
            [attr.aria-expanded]="sectionOpen.brand"
            (click)="toggleSection('brand')">
            Marca
            <span class="section-chevron" aria-hidden="true"></span>
          </button>

          <div *ngIf="sectionOpen.brand" class="option-list">
            <label class="search-field">
              <span>Buscar marca</span>
              <input
                type="search"
                [(ngModel)]="brandSearch"
                placeholder="Digite o nome">
            </label>

            <label *ngFor="let brand of visibleBrandOptions" class="checkbox-option">
              <input
                type="checkbox"
                [checked]="isSelected(selectedBrands, brand)"
                (change)="toggleOption(selectedBrands, brand)">
              <span>{{ brand }}</span>
            </label>
            <p *ngIf="!visibleBrandOptions.length" class="empty-options">Nenhuma marca encontrada.</p>
          </div>
        </section>

        <section class="filter-section">
          <button
            type="button"
            class="section-toggle"
            [attr.aria-expanded]="sectionOpen.color"
            (click)="toggleSection('color')">
            Cor
            <span class="section-chevron" aria-hidden="true"></span>
          </button>

          <div *ngIf="sectionOpen.color" class="option-list">
            <label *ngFor="let color of colorOptions" class="checkbox-option color-option">
              <input
                type="checkbox"
                [checked]="isSelected(selectedColors, color)"
                (change)="toggleOption(selectedColors, color)">
              <span class="color-swatch" [style.background]="getColorSwatch(color)" aria-hidden="true"></span>
              <span>{{ color }}</span>
            </label>
            <p *ngIf="!colorOptions.length" class="empty-options">Sem cores disponiveis.</p>
          </div>
        </section>

        <section class="filter-section">
          <button
            type="button"
            class="section-toggle"
            [attr.aria-expanded]="sectionOpen.price"
            (click)="toggleSection('price')">
            Preco
            <span class="section-chevron" aria-hidden="true"></span>
          </button>

          <div *ngIf="sectionOpen.price" class="price-fields">
            <label>
              <span>Minimo</span>
              <input
                type="number"
                min="0"
                step="0.01"
                [(ngModel)]="minimumPrice"
                (ngModelChange)="applyFilters(false)"
                aria-label="Preco minimo"
                placeholder="0">
            </label>

            <label>
              <span>Maximo</span>
              <input
                type="number"
                min="0"
                step="0.01"
                [(ngModel)]="maximumPrice"
                (ngModelChange)="applyFilters(false)"
                aria-label="Preco maximo"
                placeholder="999">
            </label>
          </div>
        </section>

        <section class="filter-section">
          <button
            type="button"
            class="section-toggle"
            [attr.aria-expanded]="sectionOpen.promotions"
            (click)="toggleSection('promotions')">
            Promocoes
            <span class="section-chevron" aria-hidden="true"></span>
          </button>

          <div *ngIf="sectionOpen.promotions" class="option-list">
            <label *ngFor="let promotion of promotionFilters" class="checkbox-option">
              <input
                type="checkbox"
                [checked]="isPromotionSelected(promotion.value)"
                (change)="togglePromotion(promotion.value)">
              <span>{{ promotion.label }}</span>
            </label>
          </div>
        </section>
      </div>

      <div class="filter-actions">
        <button type="button" class="btn-clear" [disabled]="!hasActiveFilters" (click)="clearFilters()">
          Limpar filtros
        </button>
        <button type="button" class="btn-apply" (click)="applyFilters()">
          Aplicar filtros
        </button>
      </div>
    </aside>

    <main class="catalog-results">
      <div class="results-heading">
        <p>{{ filteredProducts.length }} produto(s)</p>
        <span *ngIf="hasActiveFilters">{{ activeFilterCount }} filtro(s) ativo(s)</span>
      </div>

      <section *ngIf="filteredProducts.length" class="products-grid">
        <div *ngFor="let product of filteredProducts" class="product-card-wrapper">
          <app-product-card [product]="product"></app-product-card>
          <button type="button" class="btn-add" (click)="addToCart(product)">Adicionar ao carrinho</button>
        </div>
      </section>

      <section *ngIf="!filteredProducts.length" class="empty-results">
        <h2>Nenhum produto encontrado</h2>
        <p>Ajuste os filtros para ver mais opcoes.</p>
        <button type="button" (click)="clearFilters()">Limpar filtros</button>
      </section>
    </main>
  </div>
</div>
