<main class="store-page">
  <section class="store-hero">
    <div class="store-hero-copy">
      <p class="store-kicker">{{ page.kicker }}</p>
      <h1>{{ page.title }}</h1>
      <p>{{ page.subtitle }}</p>
      <button type="button" (click)="navigateToAction()">{{ page.actionLabel }}</button>
    </div>

    <div class="store-hero-media">
      <img [src]="logoPath" alt="Mundo Colore" />
    </div>
  </section>

  <section *ngIf="page.contactEmail" class="contact-panel" aria-labelledby="contact-email-title">
    <div class="contact-panel-icon" aria-hidden="true">&#64;</div>
    <div>
      <p class="store-kicker">Canal oficial</p>
      <h2 id="contact-email-title">Envie um e-mail para a Mundo Colore</h2>
      <p>{{ page.contactNote }}</p>
    </div>
    <a [href]="'mailto:' + page.contactEmail">{{ page.contactEmail }}</a>
  </section>

  <section class="store-section">
    <div class="section-head">
      <p class="store-kicker">Mundo Colore</p>
      <h2>{{ page.highlightTitle }}</h2>
      <p>{{ page.highlightText }}</p>
    </div>

    <div class="store-grid">
      <article *ngFor="let card of page.cards" class="store-card">
        <span aria-hidden="true"></span>
        <h3>{{ card.title }}</h3>
        <p>{{ card.text }}</p>
      </article>
    </div>
  </section>
</main>

<app-footer></app-footer>
